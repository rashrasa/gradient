[package]
name = "fourier-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
symphonia = { version = "0.6", features = ["all-codecs"] }
wasm-bindgen = "0.2.121"

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
approx = "0.5.1"

[[bin]]
name = "fft-test"
path = "bin/fft-test/main.rs"

[[example]]
name = "example-1"
path = "examples/example_1.rs"
