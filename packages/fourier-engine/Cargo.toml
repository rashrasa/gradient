[package]
name = "fourier-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
console_error_panic_hook = "0.1.7"
hound = "3.5.1"
symphonia = { version = "0.6", features = ["all-codecs"] }
wasm-bindgen = "0.2.121"
web-sys = "0.3.99"

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
approx = "0.5.1"
rustfft = "6.4.1"
hound = "3.5.1"

[[bin]]
name = "fft-test"
path = "bin/fft-test/main.rs"
